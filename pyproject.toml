[project]
name = "paperlens-core"
version = "0.2.0"
description = "Python core engine and sidecar for PaperLens."
requires-python = ">=3.12,<3.13"
license = "Unlicense"
dependencies = [
  "pydantic>=2.12.0",
  "PyMuPDF>=1.27.0",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.20.0",
]
dev = [
  "ruff>=0.14.0",
]

[project.scripts]
paperlens-core = "paperlens_core.main:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paperlens_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]
