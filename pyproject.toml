[project]
name = "paperlens-core"
version = "0.1.0"
description = "Python core engine and sidecar for PaperLens."
requires-python = ">=3.12,<3.15"
license = "Unlicense"
dependencies = [
  "anthropic>=0.75.0",
  "openai>=2.0.0",
  "openai-agents>=0.14.2",
  "pydantic>=2.12.0",
  "PyMuPDF>=1.27.0",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.20.0",
]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.14.0",
]

[project.scripts]
paperlens-core = "paperlens_core.main:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paperlens_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:anyio"]
