name: Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build PaperLens Windows installer
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      OPENAI_AGENTS_DONT_LOG_MODEL_DATA: "1"
      OPENAI_AGENTS_DONT_LOG_TOOL_DATA: "1"
      OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust and NSIS
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          choco install nsis -y --no-progress

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip uv
          npm ci

      - name: Guard against committed secrets
        shell: pwsh
        run: |
          $patterns = @(
            'sk-[A-Za-z0-9_-]{16,}',
            'tp-[A-Za-z0-9_-]{16,}',
            'ghp_[0-9A-Za-z_]{36}',
            'github_pat_[0-9A-Za-z_]+',
            'AIza[0-9A-Za-z_-]{35}',
            'BEGIN\s+(RSA\s+|OPENSSH\s+|EC\s+|DSA\s+)?PRIVATE\s+KEY'
          )
          $regex = [regex]::new(($patterns -join '|'), [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
          $files = @(git ls-files)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not list tracked files for secret scan."
          }

          $hits = [System.Collections.Generic.List[string]]::new()
          foreach ($file in $files) {
            if ($file -like 'tests/*') { continue }
            if ($file -like '.github/workflows/windows-installer.yml') { continue }
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { continue }

            try {
              $content = Get-Content -LiteralPath $file -Raw -ErrorAction Stop
            } catch {
              continue
            }
            if ($null -eq $content) { continue }
            if ($content.IndexOf([char]0) -ge 0) { continue }

            if ($regex.IsMatch($content)) {
              $hits.Add($file)
            }
          }

          if ($hits.Count -gt 0) {
            $hits | ForEach-Object { Write-Error "Potential secret or private key in tracked file: $_" }
            throw "Potential secret or private key found in tracked files."
          }

      - name: Python checks
        shell: pwsh
        run: |
          uv run --extra dev ruff check .
          uv run --extra dev pytest

      - name: Frontend checks
        shell: pwsh
        run: |
          npm run lint
          npm run build

      - name: Build PaperLens Core sidecar
        shell: pwsh
        run: npm run core:build

      - name: Build NSIS installer
        shell: pwsh
        run: npm run tauri:build

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced."
          }
          if (Test-Path "src-tauri/target/release/bundle/msi/*.msi") {
            throw "MSI output was produced unexpectedly; PaperLens should publish NSIS per-user only."
          }
          if ($installer.Length -lt 10MB) {
            throw "Installer is unexpectedly small: $($installer.FullName)"
          }
          "Installer: $($installer.FullName)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaperLens-Windows-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: PaperLens-Windows-NSIS
          path: release

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          installer="$(find release -maxdepth 1 -name '*.exe' -print -quit)"
          if [ -z "$installer" ]; then
            echo "No installer found in artifact."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$installer" --clobber
          else
            gh release create "$tag" "$installer" --title "$tag" --notes "PaperLens $tag"
          fi
