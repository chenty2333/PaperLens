name: Windows Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish or update a GitHub Release after building"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Optional release tag override, for example v0.1.4"
        required: false
        default: ""
        type: string
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          npm ci

      - name: Check synchronized versions
        run: npm run version:check

      - name: Python lint
        run: uv run --extra dev ruff check .

      - name: Frontend lint and build
        run: |
          npm run lint
          npm run build

  build-windows:
    name: Build PaperLens Windows installer
    needs: preflight
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    timeout-minutes: 90
    outputs:
      release_tag: ${{ steps.release-meta.outputs.release_tag }}
      should_publish: ${{ steps.release-meta.outputs.should_publish }}
    env:
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release-meta
        shell: pwsh
        env:
          DISPATCH_PUBLISH: ${{ inputs.publish_release || 'false' }}
          DISPATCH_TAG: ${{ inputs.release_tag || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json).version
          $releaseTag = if ($env:DISPATCH_TAG.Trim()) { $env:DISPATCH_TAG.Trim() } elseif ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v$version" }
          $shouldPublish = "false"

          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -like "v*") {
            $shouldPublish = "true"
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:DISPATCH_PUBLISH -eq "true") {
            $shouldPublish = "true"
          } elseif ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF -eq "refs/heads/main") {
            $before = "${{ github.event.before }}"
            if ($before -and $before -notmatch "^0+$") {
              try {
                $oldVersion = (git show "${before}:package.json" | ConvertFrom-Json).version
                if ($oldVersion -ne $version) {
                  $shouldPublish = "true"
                }
              } catch {
                Write-Host "Could not read previous package.json version; leaving release publish disabled for this push."
              }
            }
            if ($shouldPublish -ne "true") {
              $releaseExists = $false
              try {
                $headers = @{
                  Authorization = "Bearer $env:GH_TOKEN"
                  "X-GitHub-Api-Version" = "2022-11-28"
                }
                $repo = $env:GITHUB_REPOSITORY
                $encodedTag = [System.Uri]::EscapeDataString($releaseTag)
                Invoke-RestMethod -Method Get -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$encodedTag" *> $null
                $releaseExists = $true
              } catch {
                $releaseExists = $false
              }
              if (-not $releaseExists) {
                Write-Host "Release $releaseTag does not exist yet; enabling publish for this main push."
                $shouldPublish = "true"
              }
            }
          }

          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "should_publish=$shouldPublish" >> $env:GITHUB_OUTPUT
          "Resolved release_tag=$releaseTag should_publish=$shouldPublish"
          exit 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install Rust and NSIS
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          choco install nsis -y --no-progress

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip uv
          npm ci

      - name: Check synchronized versions
        shell: pwsh
        run: npm run version:check

      - name: Configure updater for signed releases
        shell: pwsh
        env:
          PAPERLENS_UPDATER_ENDPOINT: ${{ vars.PAPERLENS_UPDATER_ENDPOINT }}
          PAPERLENS_UPDATER_PUBKEY: ${{ secrets.PAPERLENS_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $pubkey = $env:PAPERLENS_UPDATER_PUBKEY.Trim()
          $privateKeyAvailable = -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)
          if (-not $pubkey -or -not $privateKeyAvailable) {
            Write-Host "Updater signing is not fully configured; building installer without updater artifacts."
            exit 0
          }

          $endpoint = $env:PAPERLENS_UPDATER_ENDPOINT.Trim()
          if (-not $endpoint) {
            $endpoint = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json"
          }

          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $config.plugins.updater.pubkey = $pubkey
          $config.plugins.updater.endpoints = @($endpoint)
          $config.bundle.createUpdaterArtifacts = $true
          $config | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $configPath -Encoding utf8
          Write-Host "Updater artifacts enabled for $endpoint"

      - name: Guard against committed secrets
        shell: pwsh
        run: |
          $patterns = @(
            '(^|[^A-Za-z0-9_])sk-[A-Za-z0-9_-]{16,}',
            '(^|[^A-Za-z0-9_])tp-[A-Za-z0-9_-]{16,}',
            '(^|[^A-Za-z0-9_])ghp_[0-9A-Za-z_]{36}',
            'github_pat_[0-9A-Za-z_]+',
            'AIza[0-9A-Za-z_-]{35}',
            'BEGIN\s+(RSA\s+|OPENSSH\s+|EC\s+|DSA\s+)?PRIVATE\s+KEY'
          )
          $regex = [regex]::new(($patterns -join '|'), [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
          $files = @(git ls-files)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not list tracked files for secret scan."
          }

          $hits = [System.Collections.Generic.List[string]]::new()
          foreach ($file in $files) {
            if ($file -like '.github/workflows/windows-installer.yml') { continue }
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { continue }

            try {
              $content = Get-Content -LiteralPath $file -Raw -ErrorAction Stop
            } catch {
              continue
            }
            if ($null -eq $content) { continue }
            if ($content.IndexOf([char]0) -ge 0) { continue }

            if ($regex.IsMatch($content)) {
              $hits.Add($file)
            }
          }

          if ($hits.Count -gt 0) {
            $hits | ForEach-Object { Write-Error "Potential secret or private key in tracked file: $_" }
            throw "Potential secret or private key found in tracked files."
          }

      - name: Build PaperLens Core sidecar
        shell: pwsh
        run: npm run core:build

      - name: Build NSIS installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Verify installer output
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced."
          }
          if (Test-Path "src-tauri/target/release/bundle/msi/*.msi") {
            throw "MSI output was produced unexpectedly; PaperLens should publish NSIS per-user only."
          }
          if ($installer.Length -lt 10MB) {
            throw "Installer is unexpectedly small: $($installer.FullName)"
          }
          "Installer: $($installer.FullName)"
          $signature = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.sig" | Select-Object -First 1
          if (-not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -and -not $signature) {
            throw "Updater signing key was provided, but no updater signature was produced."
          }
          if ($signature) {
            "Updater signature: $($signature.FullName)"
          }

      - name: Build portable zip
        shell: pwsh
        run: .\scripts\build_windows_portable.ps1 -SkipInstall -SkipBuild

      - name: Generate updater manifest
        shell: pwsh
        run: |
          $artifactDir = "src-tauri/target/release/bundle/nsis"
          $signature = Get-ChildItem $artifactDir -Filter "*.sig" | Select-Object -First 1
          if (-not $signature) {
            Write-Host "No updater signature found; skipping latest.json."
            exit 0
          }
          $version = (Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json).version
          uv run python scripts/generate_tauri_latest.py `
            --version $version `
            --tag "${{ steps.release-meta.outputs.release_tag }}" `
            --repo "$env:GITHUB_REPOSITORY" `
            --artifact-dir $artifactDir `
            --output "$artifactDir/latest.json" `
            --notes-file RELEASE_NOTES.md

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: PaperLens-Windows-Release
          path: |
            src-tauri/target/release/bundle/nsis/*
            build/PaperLens-*-windows-x64-portable.zip
            build/PaperLens-*-windows-x64-portable.zip.sha256
            build/PaperLens-*-windows-x64-portable.json
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub release
    if: needs.build-windows.outputs.should_publish == 'true'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Windows release artifacts
        uses: actions/download-artifact@v7
        with:
          name: PaperLens-Windows-Release
          path: release

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.build-windows.outputs.release_tag }}"
          repo="${GITHUB_REPOSITORY:?}"
          installer="$(find release -maxdepth 1 -name '*.exe' -print -quit)"
          mapfile -t assets < <(find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.sig' -o -name 'latest.json' -o -name '*.zip' -o -name '*.sha256' -o -name '*.json' \) | sort)
          if [ -z "$installer" ]; then
            echo "No installer found in artifact."
            exit 1
          fi
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found in artifact."
            exit 1
          fi
          if [ -z "$tag" ]; then
            echo "No release tag was resolved."
            exit 1
          fi
          notes_args=(--notes "PaperLens $tag")
          if [ -f RELEASE_NOTES.md ]; then
            notes_args=(--notes-file RELEASE_NOTES.md)
          fi
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$repo" --clobber
            gh release edit "$tag" --repo "$repo" "${notes_args[@]}"
          else
            gh release create "$tag" "${assets[@]}" --repo "$repo" --target "$GITHUB_SHA" --title "$tag" "${notes_args[@]}"
          fi
